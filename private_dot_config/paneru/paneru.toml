[options]
focus_follows_mouse = false
mouse_follows_focus = false
window_resize_cycle = false
preset_column_widths = [0.25, 0.33, 0.5, 0.66, 0.75, 1.00]

[swipe.gesture]
vertical = false

[bindings]
# key bindings live in skhdrc via `paneru send-cmd` — single place to blacklist for games
# only what send-cmd can't reach stays here:
window_focus_unmanaged = "cmd + alt - u"           # focus a floating window
window_focus_managed   = "cmd + alt + shift - u"   # focus back to tiled

[decorations]
workspace_menu_status = false
workspace_popup_status = false

# yabai: padding 4 + external_bar bottom 26 (sketchybar is position=bottom)
[padding]
top = 4
bottom = 30
left = 4
right = 4

# yabai window_gap 6
[windows.all]
title = ".*"
horizontal_padding = 4
vertical_padding = 0

# ---- float rules (from yabairc) ----
[windows.system_settings]
title = ".*"
bundle_id = "com.apple.systempreferences"
floating = true
grid = "8:8:2:1:4:6"

[windows.finder_info]
title = ".* Info$"
bundle_id = "com.apple.finder"
floating = true

