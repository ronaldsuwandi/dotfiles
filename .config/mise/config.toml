# photos.app menu shortcuts (\u001b = menu path separator)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Photos"
key = "NSUserKeyEquivalents"
path = ["\u001bImage\u001bAdjust Date and Time..."]
value = "@t" # cmd+t

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Photos"
key = "NSUserKeyEquivalents"
path = ["\u001bImage\u001bLocation\u001bCopy Location"]
value = "@$c" # cmd+shift+c

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Photos"
key = "NSUserKeyEquivalents"
path = ["\u001bPhotos\u001bServices\u001bAssign GPS Coordinates to Photos"]
value = "@$g" # cmd+shift+g

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Photos"
key = "NSUserKeyEquivalents"
path = ["\u001bPhotos\u001bServices\u001bAssign Location to Photos"]
value = "@$a" # cmd+shift+a

[bootstrap.hooks]
post-defaults = [
    # assign 1password and activity monitor to all spaces
    # (nimble commander dropped: pinned to all spaces it fought window focus instead of following it)
    "defaults write com.apple.spaces app-bindings -dict-add com.1password.1password AllSpaces",
    "defaults write com.apple.spaces app-bindings -dict-add com.apple.activitymonitor AllSpaces",
    # drop the Japanese IME's alphanumeric (Roman) mode so English is always plain ABC.
    # array of dicts, so it can't be a path patch; idempotent (no-op once Roman is gone). may need a re-login to show
    "defaults export com.apple.HIToolbox - | python3 -c \"import plistlib,sys; p=plistlib.loads(sys.stdin.buffer.read()); k='AppleEnabledInputSources'; p[k]=[s for s in p.get(k,[]) if s.get('Input Mode')!='com.apple.inputmethod.Roman']; sys.stdout.buffer.write(plistlib.dumps(p))\" | defaults import com.apple.HIToolbox - && killall cfprefsd",
    # list photos.app under System Settings > Keyboard Shortcuts > App Shortcuts so the
    # NSUserKeyEquivalents entries above are visible/editable there (they work without it).
    # custommenu.apps is an array, so it can't be a path patch; grep guard avoids duplicate -array-add on re-runs
    "defaults read com.apple.universalaccess com.apple.custommenu.apps | grep -q com.apple.Photos || defaults write com.apple.universalaccess com.apple.custommenu.apps -array-add com.apple.Photos",
]
