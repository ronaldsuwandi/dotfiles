[tools]
go = "latest"
java = "temurin"
node = "latest"
python = "latest"
bun = "latest"
rust = "latest"
luajit = "latest"

# bootstrap sections
[bootstrap.macos.dock]
autohide = false
orientation = "left"
tilesize = 32
magnification = true
largesize = 46
show_recents = false
mru_spaces = false


[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true

# bootstrap.macos.defaults_entries: path-based patches, never overrides sibling keys

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "_HIHideMenuBar"
value = true # auto hide menubar

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "AppleKeyboardUIMode"
value = 2 # keyboard navigation

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.TextInputMenu"
key = "visible"
value = true # show input menu in menubar

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.WindowManager"
key = "EnableStandardClickToShowDesktop"
value = false # disable click to show desktop

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadCornerSecondaryClick"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFiveFingerPinchGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFourFingerHorizSwipeGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFourFingerPinchGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFourFingerVertSwipeGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerDrag"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerHorizSwipeGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerTapGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerVertSwipeGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadTwoFingerDoubleTapGesture"
value = 1

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadTwoFingerFromRightEdgeSwipeGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXICloudDriveDesktop"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXICloudDriveDocuments"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXICloudDriveEnabled"
value = true

# hot corners
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.dock"
key = "wvous-tr-corner"
value = 2 # top-right: mission control

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.dock"
key = "wvous-tr-modifier"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.dock"
key = "wvous-br-corner"
value = 4 # bottom-right: desktop

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.dock"
key = "wvous-br-modifier"
value = 0

# ctrl+f3: move focus to the Dock
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["8"]
value = { enabled = true, value = { parameters = [65535, 99, 8650752], type = "standard" } }

[bootstrap.hooks]
# assign 1password, activity monitor and nimble commander to all spaces
post-defaults = [
    "defaults write com.apple.spaces app-bindings -dict-add com.1password.1password AllSpaces",
    "defaults write com.apple.spaces app-bindings -dict-add com.apple.activitymonitor AllSpaces",
    "defaults write com.apple.spaces app-bindings -dict-add info.filesmanager.files AllSpaces",
]
