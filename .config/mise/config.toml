[tools]
# sdk
go = "latest"
java = "temurin"
node = "latest"
python = "latest"
bun = "latest"
rust = "latest"
luajit = "latest"

# tooling
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
uv = "latest"
rust-analyzer = "latest"

# apps
"pypi:osxphotos" = "latest"
"github:yt-dlp/yt-dlp" = "latest"

# bootstrap sections
[bootstrap.macos.dock]
autohide = false
orientation = "left"
tilesize = 32
magnification = true
largesize = 46
show_recents = false
mru_spaces = false


[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true

# bootstrap.macos.defaults_entries: path-based patches, never overrides sibling keys

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "_HIHideMenuBar"
value = true # auto hide menubar

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "AppleKeyboardUIMode"
value = 2 # keyboard navigation

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.TextInputMenu"
key = "visible"
value = true # show input menu in menubar

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.WindowManager"
key = "EnableStandardClickToShowDesktop"
value = false # disable click to show desktop

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadCornerSecondaryClick"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFiveFingerPinchGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFourFingerHorizSwipeGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFourFingerPinchGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadFourFingerVertSwipeGesture"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerDrag"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerHorizSwipeGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerTapGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadThreeFingerVertSwipeGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadTwoFingerDoubleTapGesture"
value = 1

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.AppleMultitouchTrackpad"
key = "TrackpadTwoFingerFromRightEdgeSwipeGesture"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXICloudDriveDesktop"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXICloudDriveDocuments"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXICloudDriveEnabled"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "AppleShowAllExtensions"
value = true # show all filename extensions

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "_FXSortFoldersFirst"
value = true # keep folders on top when sorting by name

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FXDefaultSearchScope"
value = "SCcf" # search the current folder by default

# spotlight: every entry here is hidden from results (key name is misleading)
# spotlight: apps allowed to show results (replaces the whole list).
# account-specific google drive sources (FileProvider.com.google.drivefs.fpext/gdrive-<id>) left out on purpose: public repo
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Spotlight"
key = "EnabledPreferenceRules"
value = [
    "com.apple.AppStore",
    "com.apple.iBooksX",
    "com.apple.iCal",
    "com.apple.AddressBook",
    "com.google.drivefs",
    "com.apple.mail",
    "com.apple.MobileSMS",
    "com.microsoft.Excel",
    "com.moneywiz.personalfinance",
    "com.apple.Photos",
    "com.apple.podcasts",
    "com.apple.Safari",
    "ru.keepcoder.Telegram",
    "com.apple.tips",
    "net.whatsapp.WhatsApp",
    "System.iphoneApps",
]

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Spotlight"
key = "DisabledUTTypes"
value = [] # no file types excluded

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Spotlight"
key = "PasteboardHistoryEnabled"
value = true # spotlight clipboard history

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Spotlight"
key = "PasteboardHistoryTimeout"
value = 1800 # keep clipboard history for 30 min (seconds)

# hot corners
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.dock"
key = "wvous-tr-corner"
value = 2 # top-right: mission control

[[bootstrap.macos.defaults_entries]]
